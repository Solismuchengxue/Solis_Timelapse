<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ "初始化管理员" if mode == "setup" else "登录" }} · Solis_Timelapse</title>
  <script src="/ui_prefs.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-heading">
      <p class="auth-brand">Solis_Timelapse</p>
      <h1 id="auth-heading">{{ "初始化管理员" if mode == "setup" else "登录" }}</h1>
      {% if mode == "setup" %}
      <p class="auth-help">首次使用请创建管理员账号。密码只会以加盐哈希保存。</p>
      {% else %}
      <p class="auth-help">输入管理员账号以进入延时摄影工作台。</p>
      {% endif %}
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% if mode == "login" %}<input type="hidden" name="next" value="{{ next_path }}">{% endif %}
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" value="{{ username }}" maxlength="64" autocomplete="username" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="256" autocomplete="{{ 'new-password' if mode == 'setup' else 'current-password' }}" required>
        {% if mode == "setup" %}
        <label for="password-confirm">确认密码</label>
        <input id="password-confirm" name="password_confirm" type="password" minlength="8" maxlength="256" autocomplete="new-password" required>
        {% endif %}
        <button class="primary-button" type="submit">{{ "创建管理员" if mode == "setup" else "登录" }}</button>
      </form>
    </section>
  </main>
</body>
</html>
